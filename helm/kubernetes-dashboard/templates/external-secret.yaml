{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.secretStore.create }}
apiVersion: external-secrets.io/v1beta1
kind: {{ .Values.externalSecrets.secretStore.kind }}
metadata:
  name: {{ .Values.externalSecrets.secretStore.name }}
  namespace: {{ include "kubernetes-dashboard.namespace" . }}
  labels:
    {{- include "kubernetes-dashboard.labels" . | nindent 4 }}
spec:
  {{- tpl (toYaml .Values.externalSecrets.secretStore.spec) . | nindent 2 }}
---
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "kubernetes-dashboard.fullname" . }}-external-secret
  namespace: {{ include "kubernetes-dashboard.namespace" . }}
  labels:
    {{- include "kubernetes-dashboard.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStore.kind }}
    name: {{ .Values.externalSecrets.secretStore.name }}
  target:
    name: {{ include "kubernetes-dashboard.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $remote := .Values.externalSecrets.data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $remote.remoteKey | quote }}
        {{- with $remote.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
