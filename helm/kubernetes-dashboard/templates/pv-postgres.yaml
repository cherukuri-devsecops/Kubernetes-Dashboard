{{/*
The target cluster has no StorageClass, so a PVC with no volume behind it stays
Pending forever and the postgres pod never schedules. This statically provisions
the volume the way the cluster's other apps do (NFS, RWX, Retain, no class).

Off by default: on a cluster with dynamic provisioning you want the
StorageClass path instead, via postgresql.persistence.storageClassName.
*/}}
{{- if and .Values.postgresql.enabled .Values.postgresql.persistence.enabled .Values.nfs.enabled }}
{{- if not .Values.nfs.server }}
{{- fail "nfs.enabled is true but nfs.server is empty - set nfs.server to the NFS host" }}
{{- end }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "kubernetes-dashboard.postgresName" . }}
  labels:
    {{- include "kubernetes-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  capacity:
    storage: {{ .Values.postgresql.persistence.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  # Bound up front to the exact claim the StatefulSet generates, so this volume
  # cannot be taken by some other pending PVC in the cluster.
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: {{ include "kubernetes-dashboard.namespace" . }}
    name: postgres-data-{{ include "kubernetes-dashboard.postgresName" . }}-0
  nfs:
    server: {{ .Values.nfs.server | quote }}
    path: {{ printf "%s/postgres" (trimSuffix "/" .Values.nfs.basePath) | quote }}
{{- end }}
