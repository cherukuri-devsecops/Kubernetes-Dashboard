{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubernetes-dashboard.secretName" . }}
  namespace: {{ include "kubernetes-dashboard.namespace" . }}
  labels:
    {{- include "kubernetes-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: {{ tpl .Values.secrets.databaseUrl . | quote }}
  REDIS_URL: {{ tpl .Values.secrets.redisUrl . | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  AUTH_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  DEMO_USER_EMAIL: {{ .Values.auth.demoUserEmail | quote }}
  DEMO_USER_PASSWORD: {{ .Values.auth.demoUserPassword | quote }}
  DEMO_USER_NAME: {{ .Values.auth.demoUserName | quote }}
{{- end }}
