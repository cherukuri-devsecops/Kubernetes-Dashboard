apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubernetes-dashboard.frontendName" . }}
  namespace: {{ include "kubernetes-dashboard.namespace" . }}
  labels:
    {{- include "kubernetes-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
  selector:
    {{- include "kubernetes-dashboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubernetes-dashboard.frontendName" . }}
  namespace: {{ include "kubernetes-dashboard.namespace" . }}
  labels:
    {{- include "kubernetes-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubernetes-dashboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "kubernetes-dashboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          env:
            # nginx resolves proxy_pass at startup, so this must be the real
            # Service name - the image's compose default ("backend") does not
            # exist in-cluster and would stop nginx from booting at all.
            - name: BACKEND_ORIGIN
              value: 'http://{{ include "kubernetes-dashboard.backendName" . }}:{{ .Values.backend.service.port }}'
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
