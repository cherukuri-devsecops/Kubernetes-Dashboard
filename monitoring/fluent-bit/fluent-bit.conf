# Logs collection for the local stack. The backend writes JSON lines to a shared
# volume; Fluent Bit tails them and ships to Loki under the same label names the
# in-cluster DaemonSet produces (kubernetes_namespace_name / _pod_name /
# _container_name), so app/services/loki/client.py queries work against either.

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     warn
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Tag               dashboard.backend
    Path              /var/log/dashboard/backend*.log
    Parser            dashboard_json
    DB                /var/log/dashboard/.fluent-bit.db
    Refresh_Interval  5
    Skip_Long_Lines   On

[FILTER]
    Name    modify
    Match   dashboard.*
    Add     kubernetes_namespace_name kube-dashboard
    Add     kubernetes_pod_name       backend
    Add     kubernetes_container_name backend

[OUTPUT]
    Name       loki
    Match      dashboard.*
    Host       loki
    Port       3100
    Labels     job=fluent-bit
    Label_keys $kubernetes_namespace_name,$kubernetes_pod_name,$kubernetes_container_name,$level
    Remove_keys kubernetes_namespace_name,kubernetes_pod_name,kubernetes_container_name
    Line_format json
