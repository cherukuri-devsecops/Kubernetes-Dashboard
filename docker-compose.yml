services:
  postgres:
    image: postgres:16-alpine
    container_name: kube-dashboard-postgres
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kube-dashboard-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: kube-dashboard-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.4.2
    container_name: kube-dashboard-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    user: "0"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  tempo:
    image: grafana/tempo:2.7.1
    container_name: kube-dashboard-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    # Named volumes are root-owned; Tempo's default uid cannot write them.
    user: "0"
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: kube-dashboard-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./monitoring/otel-collector/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_healthy

  fluent-bit:
    image: fluent/fluent-bit:3.2.5
    container_name: kube-dashboard-fluent-bit
    restart: unless-stopped
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    volumes:
      - ./monitoring/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./monitoring/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - dashboard_logs:/var/log/dashboard
    depends_on:
      loki:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: kube-dashboard-backend
    environment:
      APP_NAME: Kubernetes Dashboard
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DATABASE_URL: postgresql://dashboard:dashboard@postgres:5432/dashboard
      REDIS_URL: redis://redis:6379/0
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      TEMPO_URL: ${TEMPO_URL:-http://tempo:3200}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_SERVICE_NAME: kubernetes-dashboard-backend
      LOG_FILE: /var/log/dashboard/backend.log
      JWT_SECRET: change-this-stage-1-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      AUTH_PROVIDER: ${AUTH_PROVIDER:-demo}
      AUTH_API_BASE_URL: ${AUTH_API_BASE_URL:-}
      AUTH_API_LOGIN_PATH: ${AUTH_API_LOGIN_PATH:-/auth/login}
      AUTH_API_ME_PATH: ${AUTH_API_ME_PATH:-/auth/me}
      AUTH_API_TIMEOUT_SECONDS: ${AUTH_API_TIMEOUT_SECONDS:-5}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_USER_EMAIL: admin@example.com
      DEMO_USER_PASSWORD: admin123
      DEMO_USER_NAME: Platform Admin
      KUBECONFIG: /root/.kube/config
    ports:
      - "8000:8000"
    volumes:
      - ${KUBECONFIG_HOST_PATH:-~/.kube}:/root/.kube:ro
      - dashboard_logs:/var/log/dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: kube-dashboard-frontend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  tempo_data:
  dashboard_logs:
