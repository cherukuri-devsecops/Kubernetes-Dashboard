name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys touch one cluster, so let a run finish rather than interleaving Helm
# upgrades. Queued rather than cancelled: a half-applied release is worse.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_RELEASE: kubernetes-dashboard
  NAMESPACE: observability
  CHART_PATH: ./helm/kubernetes-dashboard
  # frontend/Dockerfile uses a cache mount, which needs BuildKit.
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    runs-on: arc-runner-set
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            image: kubernetes-dashboard-frontend
          - component: backend
            image: kubernetes-dashboard-backend

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build ${{ matrix.component }} image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${IMAGE_TAG}" \
            "./${{ matrix.component }}"

      - name: Push ${{ matrix.component }} image
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${IMAGE_TAG}"

  deploy:
    needs: [build]
    runs-on: arc-runner-set
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Resolve image tag
        # Recomputed rather than passed between jobs: a matrix job cannot emit a
        # single shared output, and the short SHA is deterministic anyway.
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Write kubeconfig
        run: |
          umask 077
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint "$CHART_PATH"

      - name: Helm upgrade
        # Everything that does not change per run - namespace.create,
        # externalSecrets, nfs, the LoadBalancer address, ingress - now lives in
        # values.yaml. Only the image tags and per-environment secrets are set here.
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          NFS_SERVER: ${{ secrets.NFS_SERVER }}
          AUTH_PROVIDER: ${{ vars.AUTH_PROVIDER }}
          AUTH_API_BASE_URL: ${{ vars.AUTH_API_BASE_URL }}
          FRONTEND_LB_IP: ${{ vars.FRONTEND_LB_IP }}
        run: |
          # Override a chart default only when the secret or variable actually
          # has a value: an unset one would otherwise pass --set-string key=""
          # and clobber a working default with an empty string.
          overrides=()
          add() { if [ -n "$2" ]; then overrides+=(--set-string "$1=$2"); fi; }
          add secrets.jwtSecret               "$JWT_SECRET"
          add auth.jwtSecret                  "$AUTH_JWT_SECRET"
          add auth.provider                   "$AUTH_PROVIDER"
          add auth.apiBaseUrl                 "$AUTH_API_BASE_URL"
          add nfs.server                      "$NFS_SERVER"
          add frontend.service.loadBalancerIP "$FRONTEND_LB_IP"

          helm upgrade --install "$HELM_RELEASE" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set-string frontend.image.repository="${{ secrets.DOCKERHUB_USERNAME }}/kubernetes-dashboard-frontend" \
            --set-string frontend.image.tag="$IMAGE_TAG" \
            --set-string backend.image.repository="${{ secrets.DOCKERHUB_USERNAME }}/kubernetes-dashboard-backend" \
            --set-string backend.image.tag="$IMAGE_TAG" \
            "${overrides[@]}" \
            --atomic \
            --timeout 10m \
            --history-max 5

      - name: Verify rollout
        run: |
          for deployment in backend frontend; do
            kubectl rollout status "deployment/${HELM_RELEASE}-${deployment}" \
              --namespace "$NAMESPACE" \
              --timeout=180s
          done

      - name: Smoke test
        # ARC runners are pods in this cluster, so the Service DNS is reachable
        # directly - no ingress, LoadBalancer IP, or port-forward needed.
        run: |
          endpoint="http://${HELM_RELEASE}-backend.${NAMESPACE}.svc.cluster.local:8000/health"
          for attempt in $(seq 1 12); do
            if curl -sf --max-time 5 "$endpoint"; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt/12 failed - retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 2 minutes"
          kubectl get pods --namespace "$NAMESPACE"
          exit 1

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
